name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'examples/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'examples/**'

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '18.x'  # See: https://nodejs.org/en/about/previous-releases
      NODE_ENV: 'test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test project
        run: yarn test

      - name: Build project
        env:
          NODE_ENV: 'production'
        run: yarn run release
